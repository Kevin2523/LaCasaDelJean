[project]
name = "lacasadeljean-mcp"
version = "0.1.0"
description = "Private MCP Streamable HTTP inventory service for La Casa del Jean V2"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.9.0,<2.0.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "PyJWT>=2.10.0",
    "starlette>=0.45.0",
    "uvicorn>=0.34.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
