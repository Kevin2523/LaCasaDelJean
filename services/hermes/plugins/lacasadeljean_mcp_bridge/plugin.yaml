name: lacasadeljean-mcp-bridge
version: "0.3.0"
description: >-
  Trusted fail-closed Hermes v0.23.4 plugin for La Casa del Jean V2.
  Exposes only read-only inventory tools and the non-mutating proposal tool
  (`propose_inventory_write`) to the LLM. Intercepts explicit human
  `CONFIRMAR <id>` / `CANCELAR <id>` replies via `post_gateway_admission`
  outside the model, mints one-use signed `approval_proof` tokens, and
  executes writes exclusively through the private MCP bridge.
provides_tools:
  - search_products
  - get_product_detail
  - get_variant_stock
  - propose_inventory_write
provides_hooks:
  - post_gateway_admission
  - pre_llm_call
  - pre_tool_call
  - on_session_end
