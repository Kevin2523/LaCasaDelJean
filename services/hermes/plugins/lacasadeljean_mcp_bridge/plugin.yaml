name: lacasadeljean-mcp-bridge
version: "0.2.0"
description: >-
  Trusted fail-closed Hermes v0.23.4 plugin that binds verified Telegram sender_id
  to session_id via pre_llm_call, blocks disallowed/spoofed calls via pre_tool_call,
  and exposes the 9 inventory MCP tools through a per-call signed X-Actor-Assertion
  bridge with scoped human-confirmed approval_proof enforcement.
provides_tools:
  - search_products
  - get_product_detail
  - get_variant_stock
  - create_product_draft
  - create_variant
  - attach_product_photo
  - set_product_price
  - record_stock_movement
  - set_product_publication_status
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - on_session_end
