# ==============================================================================
# Hermes Agent v0.23.4 - Configuración interna para La Casa del Jean V2
# Montado en /opt/data/config.yaml (solo lectura). Sin secretos en texto plano.
# ==============================================================================

model:
  provider: "${HERMES_LLM_PROVIDER}"
  name: "${HERMES_MODEL}"
  max_tokens: 2048
  temperature: 0.2

# Límites de contexto y costo para servidor 8 GB RAM (Ryzen 3)
agent:
  max_turns: 12
  max_tool_calls_per_turn: 6
  context_compression: true
  soul_file: "/opt/data/SOUL.md"

# Gateway Telegram: un solo bot, long polling saliente, sin puertos publicados
gateway:
  api_server:
    enabled: false
  dashboard:
    enabled: false
  telegram:
    enabled: true
    mode: "polling"
    session_scope: "per_user"
    allowed_users_env: "TELEGRAM_ALLOWED_USERS"
    allow_groups: false

# Herramientas integradas: deshabilitar terminal, navegador, archivos y SQL directo
toolsets:
  enabled:
    - "vision"
    - "mcp"
  disabled:
    - "terminal"
    - "browser"
    - "file"
    - "web"
    - "code_execution"
    - "cron"

# Soporte de fotos (visión nativa de Hermes)
vision:
  enabled: true
  max_image_size_mb: 10

# Soporte de notas de voz (STT integrado de Hermes; sin servicio Whisper separado)
# Por defecto usa proveedor hospedado (openai/groq). Solo cambiar a faster-whisper
# (modelo tiny/base) si los recursos del servidor Ryzen 3 8 GB RAM lo permiten.
voice_mode:
  enabled: true
  stt:
    provider: "${HERMES_STT_PROVIDER}"
    model: "${HERMES_STT_MODEL}"
    language: "es"
  tts:
    enabled: false

# Servidor MCP privado de inventario (red interna app_edge, sin puerto público)
mcp_servers:
  inventory:
    enabled: true
    transport: "streamable_http"
    url: "${HERMES_MCP_URL}"
    timeout: 30
    headers:
      Authorization: "Bearer ${HERMES_MCP_SHARED_SECRET}"
    allowed_tools:
      - "search_products"
      - "get_product_detail"
      - "get_variant_stock"
      - "create_product_draft"
      - "create_variant"
      - "attach_product_photo"
      - "set_product_price"
      - "record_stock_movement"
      - "set_product_publication_status"

# Plugin confiable de puente MCP: inyecta X-Actor-Assertion por usuario Telegram
# y exige approval_proof firmado y acotado para toda escritura (fail-closed).
plugins:
  enabled:
    - "lacasadeljean_mcp_bridge"
