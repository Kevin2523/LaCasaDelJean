name: lacasadeljean-v2

services:
  postgres:
    image: postgres:16-alpine
    container_name: lcdj_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lacasadeljean_v2}
      POSTGRES_USER: ${POSTGRES_USER:-lacasadeljean}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env antes de iniciar}
      TZ: ${TZ:-America/Bogota}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - db_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-lacasadeljean} -d $${POSTGRES_DB:-lacasadeljean_v2}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: lcdj_api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL en .env antes de iniciar}
      MEDIA_ROOT: ${MEDIA_ROOT:-/app/storage/media}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:4200,http://localhost:4200}
      HERMES_MCP_SHARED_SECRET: ${HERMES_MCP_SHARED_SECRET:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./storage/media:/app/storage/media
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db_internal
      - app_edge
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: lcdj_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-4200}:8080"
    depends_on:
      - api
    networks:
      - app_edge
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 384M

  mcp:
    build:
      context: ./services/mcp
      dockerfile: Dockerfile
    container_name: lcdj_mcp
    profiles:
      - mcp
      - hermes
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_INTERNAL_URL: http://api:8000
      HERMES_MCP_SHARED_SECRET: ${HERMES_MCP_SHARED_SECRET:-}
      MCP_ACTOR_ASSERTION_SECRET: ${MCP_ACTOR_ASSERTION_SECRET:-}
      MCP_APPROVAL_SIGNING_SECRET: ${MCP_APPROVAL_SIGNING_SECRET:-}
      MCP_PORT: ${MCP_PORT:-8010}
    depends_on:
      - api
    networks:
      - app_edge
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  hermes_init:
    image: alpine:3.20
    container_name: lcdj_hermes_init
    profiles:
      - hermes
    restart: "no"
    command: ["sh", "/usr/local/bin/init-hermes-config.sh"]
    environment:
      HERMES_DATA_DIR: /opt/data
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      HERMES_FORCE_CONFIG_RESET: ${HERMES_FORCE_CONFIG_RESET:-false}
    volumes:
      - hermes_data:/opt/data
      - ./services/hermes/config/config.yaml:/opt/data/config.template.yaml:ro
      - ./services/hermes/scripts/init-hermes-config.sh:/usr/local/bin/init-hermes-config.sh:ro
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  hermes:
    image: nousresearch/hermes-agent:${HERMES_IMAGE_TAG:-v0.23.4}
    container_name: lcdj_hermes
    profiles:
      - hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-America/Bogota}
      HERMES_HOME: /opt/data
      HERMES_MCP_URL: ${HERMES_MCP_URL:-http://mcp:8010/mcp}
      HERMES_MCP_SHARED_SECRET: ${HERMES_MCP_SHARED_SECRET:-}
      MCP_ACTOR_ASSERTION_SECRET: ${MCP_ACTOR_ASSERTION_SECRET:-}
      MCP_APPROVAL_SIGNING_SECRET: ${MCP_APPROVAL_SIGNING_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      HERMES_LLM_PROVIDER: ${HERMES_LLM_PROVIDER:-openai}
      HERMES_MODEL: ${HERMES_MODEL:-gpt-4.1-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NOUS_API_KEY: ${NOUS_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HERMES_STT_PROVIDER: ${HERMES_STT_PROVIDER:-openai}
      HERMES_STT_MODEL: ${HERMES_STT_MODEL:-whisper-1}
    volumes:
      - hermes_data:/opt/data
      - ./services/hermes/config/config.yaml:/opt/data/config.template.yaml:ro
      - ./services/hermes/config/SOUL.md:/opt/data/SOUL.md:ro
      - ./services/hermes/plugins/lacasadeljean_mcp_bridge:/opt/data/plugins/lacasadeljean_mcp_bridge:ro
    depends_on:
      hermes_init:
        condition: service_completed_successfully
      mcp:
        condition: service_started
    networks:
      - app_edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1536M

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: lcdj_cloudflared
    profiles:
      - tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web
      - api
    networks:
      - app_edge
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

networks:
  db_internal:
    driver: bridge
    internal: true
  app_edge:
    driver: bridge

volumes:
  postgres_data:
  hermes_data:
