name: CI Fase 0 — Validación de Configuración y Documentación

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  validate-config-and-docs:
    name: Validar Compose, Seguridad Base y Documentación
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Verificar archivos base y documentación requerida
        run: |
          set -euo pipefail
          required_files=(
            ".env.example"
            ".gitignore"
            ".dockerignore"
            "docker-compose.yml"
            "README.md"
            "docs/architecture.md"
            "docs/security.md"
            "docs/conventions.md"
            "docs/branching-and-prs.md"
            "docs/phases.md"
            "docs/decisions.md"
          )
          for f in "${required_files[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "Falta archivo requerido: $f"
              exit 1
            fi
          done

      - name: Verificar ausencia de archivos con secretos versionados
        run: |
          set -euo pipefail
          if git ls-files | grep -vE '^\.env\.example$' | grep -E '(^\.env$|^\.env\.|infra/cloudflared/.*\.json$|infra/cloudflared/config\.yml$)'; then
            echo "ERROR: Se detectaron archivos sensibles versionados en Git."
            exit 1
          fi

      - name: Validar sintaxis de Docker Compose con .env.example (base y perfiles)
        run: |
          set -euo pipefail
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example --profile hermes --profile tunnel config --quiet

  hermes-telegram-tests:
    name: Pruebas Plugin Hermes v0.23.4 y Flujos Telegram (F3-02/F3-03)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de pruebas Hermes/MCP
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx pyjwt pyyaml pillow "mcp<2" starlette pydantic-settings

      - name: Ejecutar pruebas de puente Hermes y flujos Telegram
        env:
          PYTHONPATH: .
        run: |
          pytest services/hermes/tests/test_hermes_bridge.py services/hermes/tests/test_telegram_workflows.py -v

      - name: Ejecutar demo E2E local sin token real
        env:
          PYTHONPATH: .
        run: |
          python services/hermes/scripts/demo_telegram_e2e.py
